version: '3.8'

# ==============================================================================
# FoodLoop AI - Local Development Full-Stack Orchestration
# Starts PostgreSQL (PostGIS), FastAPI Backend, and Next.js Frontend with one command:
#   docker compose up --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Database Service (PostgreSQL 16 + PostGIS 3.4 Spatial Extensions)
  # ----------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: foodloop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodloop_dev_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-foodloop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-foodloop}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - foodloop_network

  # ----------------------------------------------------------------------------
  # 2. Backend API Service (FastAPI + ML Engine)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodloop_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - PROJECT_NAME=FoodLoop AI
      - API_V1_STR=/api/v1
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-32-chars-long-foodloop-2026}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-foodloop_dev_secret_2026}@db:5432/${POSTGRES_DB:-foodloop}
      - SUPABASE_URL=${SUPABASE_URL:-https://your-project.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-your-anon-key}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN:-pk.demo_mapbox_token}
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - LOG_LEVEL=INFO
      - PROMETHEUS_METRICS_ENABLED=true
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - foodloop_network

  # ----------------------------------------------------------------------------
  # 3. Frontend Web Application (Next.js 14)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/Dockerfile.frontend
    container_name: foodloop_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://your-project.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-your-anon-key}
      - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN:-pk.demo_token}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - foodloop_network

volumes:
  postgres_data:
    driver: local

networks:
  foodloop_network:
    driver: bridge
